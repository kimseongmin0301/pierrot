[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pierrot"
version = "0.1.0"
description = "LLM 답변을 주장 단위로 분해하고 실제 데이터로 검증하는 시스템"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langgraph>=1.0",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "langchain-community>=0.3",
    "python-dotenv>=1.0",
    "finance-datareader>=0.9.50",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pykrx>=1.0.45",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: 실제 모델을 적재하는 테스트. 기본 실행에서는 제외합니다 (pytest -m slow 로 실행).",
]
addopts = "-m 'not slow'"
